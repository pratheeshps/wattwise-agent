name: Wattwise CI
on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: wattwise, POSTGRES_PASSWORD: wattwise, POSTGRES_DB: wattwise }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattwise -d wattwise"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://wattwise:wattwise@localhost:5432/wattwise
      BETTER_AUTH_SECRET: ci-only-secret-that-is-not-used-for-real-auth-123456
      BETTER_AUTH_URL: http://127.0.0.1:3101
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3101
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3101
      SMTP_URL: smtp://127.0.0.1:1025
      SMTP_FROM: Wattwise E2E <noreply@example.test>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run format:check
      - run: npm run db:migrate:deploy
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:smoke

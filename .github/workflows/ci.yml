name: Wattwise CI

on:
  push:
    branches: [main, "feature/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build production application
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/wattwise
          BETTER_AUTH_SECRET: ci-only-secret-that-is-not-used-for-real-auth-123456
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build
      - name: Smoke-test production routes and APIs
        run: npm run test:smoke
